<title>Legend of Monster 試作版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: one arcade cabinet screen centered, control legend underneath. Deliberately single dark neon theme. */
:root {
  --void: #07060d;
  --panel: #110f1d;
  --ink: #e9e6ff;
  --dim: #8a84ad;
  --cyan: #2ef2ff;
  --magenta: #ff2bd6;
  --amber: #ffc23a;
  --line: #2a2546;
  --display: "Chakra Petch", "Noto Sans JP", system-ui, sans-serif;
  --body: "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--void); color: var(--ink); }
body { font-family: var(--body); padding: 20px 16px 32px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 4vw, 32px); letter-spacing: .06em; margin: 0; text-transform: uppercase; text-shadow: 0 0 12px rgba(46,242,255,.55); color: var(--cyan); }
h1 span { color: var(--magenta); text-shadow: 0 0 12px rgba(255,43,214,.55); }
.tag { font-family: var(--display); font-size: 12px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.screen { position: relative; border: 1px solid var(--line); background: #000; box-shadow: 0 0 0 1px #000, 0 0 40px rgba(255,43,214,.12); }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; outline: none; }
canvas:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
.keys { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--dim); }
.keys b { font-family: var(--display); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; padding: 1px 7px; margin-right: 6px; font-weight: 500; }
.note { font-size: 13px; color: var(--dim); line-height: 1.7; max-width: 70ch; margin: 0; }
.note strong { color: var(--amber); font-weight: 700; }
</style>

<div class="wrap">
  <header>
    <h1>Legend of <span>Monster</span></h1>
    <div class="tag">Prototype · Sector 01 / 地下廃区画</div>
  </header>
  <div class="screen"><canvas id="game" width="960" height="540" tabindex="0" aria-label="ゲーム画面"></canvas></div>
  <div class="keys">
    <span><b>WASD</b>移動</span>
    <span><b>J</b>攻撃（長押しで連続）</span>
    <span><b>Space</b>ダッシュ回避</span>
    <span><b>1</b><b>2</b><b>3</b>大剣／片手剣／弓</span>
    <span><b>Enter</b>出撃・再出撃</span>
  </div>
  <p class="note">雰囲気を確かめるための試作版です。雑魚の部屋を3つ抜けると、ボス「ボルトボア」が出ます。敵は装備を落とし、強ければ自動で装備します。レベルが上がるとインプラントを3つから1つ選べます。死ぬとラン中の装備はすべて失います。<strong>ボルトボアは冷却属性が弱点</strong>なので、冷却付きの装備かインプラントを拾えると楽になります。PCのキーボードで遊んでください。</p>
</div>

<script>
(() => {
const cv = document.getElementById('game');
const g = cv.getContext('2d');
const W = 960, H = 540, WALL = 28;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Chakra Petch","Noto Sans JP",sans-serif';
const C = { cyan:'#2ef2ff', mag:'#ff2bd6', amber:'#ffc23a', red:'#ff4d5e', green:'#5dffa0', ink:'#e9e6ff', dim:'#8a84ad', ice:'#8fd8ff' };
const RAR = [
  { name:'コモン', color:'#c9c5e6', w:60 },
  { name:'レア', color:'#2ef2ff', w:28 },
  { name:'エピック', color:'#c77dff', w:10 },
  { name:'レジェンド', color:'#ffc23a', w:2 },
];
const ELEM = { shock:{ name:'電撃', color:'#fff36b' }, heat:{ name:'熱', color:'#ff7a3d' }, cold:{ name:'冷却', color:'#8fd8ff' } };
const WEAPONS = [
  { name:'大剣', cd:0.72, dmg:34, range:78, arc:2.4, type:'melee' },
  { name:'片手剣', cd:0.26, dmg:12, range:50, arc:1.7, type:'melee' },
  { name:'弓', cd:0.42, dmg:15, type:'bow', speed:640 },
];
const IMPLANTS = [
  { id:'atk', name:'オーバークロック', desc:'攻撃力 +20%', stack:true },
  { id:'spd', name:'人工筋繊維', desc:'移動速度 +15%', stack:true },
  { id:'chain', name:'連鎖放電', desc:'撃破時、近くの敵2体に電撃' },
  { id:'adren', name:'アドレナリン回路', desc:'ダッシュ後2秒間 攻撃力 +50%' },
  { id:'armor', name:'装甲プレート', desc:'最大HP +25、全回復', stack:true },
  { id:'reach', name:'拡張ブレード', desc:'近接範囲 +25%／矢が1体貫通' },
  { id:'cold', name:'冷却コア', desc:'攻撃に冷却属性を付与' },
  { id:'nano', name:'ナノ修復', desc:'撃破するたびHP +2' },
];

const keys = new Set();
let S; // game state
let shake = 0;

function newRun() {
  S = {
    mode:'title', time:0, room:0, rooms:4,
    p:{ x:120, y:H/2, r:12, hp:100, baseHp:100, fx:1, fy:0, atkCd:0, dashCd:0, dashT:0, inv:0, adrenT:0, weapon:0, lvl:1, xp:0, xpNext:40, swing:null },
    gear:{ '武器':null, '防具':null, 'アクセ':null },
    implants:{}, st:null,
    enemies:[], shots:[], loot:[], fx:[], texts:[], pillars:[], toasts:[], bolts:[],
    doorOpen:false, choices:null, kills:0,
  };
  recalc();
  S.p.hp = S.st.maxHp;
}

function recalc() {
  const st = { dmg:0, crit:0.05, spd:0, maxHp:S.p.baseHp, elem:null };
  for (const k in S.gear) { const it = S.gear[k]; if (!it) continue;
    st.dmg += it.dmg||0; st.crit += it.crit||0; st.spd += it.spd||0; st.maxHp += it.hp||0; if (it.elem) st.elem = it.elem; }
  const im = S.implants;
  st.dmg += 0.2 * (im.atk||0); st.spd += 0.15 * (im.spd||0); st.maxHp += 25 * (im.armor||0);
  if (im.cold) st.elem = 'cold';
  S.st = st;
  S.p.hp = Math.min(S.p.hp, st.maxHp);
}

/* ---------- rooms ---------- */
function enterRoom(n) {
  S.room = n; S.doorOpen = false; S.enemies = []; S.shots = []; S.loot = []; S.bolts = [];
  S.p.x = 90; S.p.y = H/2;
  S.pillars = [];
  const boss = n === S.rooms;
  const np = boss ? 2 : 2 + (Math.random()*3|0);
  for (let i=0; i<np; i++) {
    for (let t=0; t<30; t++) {
      const pl = { x: 260 + Math.random()*(W-420), y: 90 + Math.random()*(H-180), r: 20 + Math.random()*18 };
      if (S.pillars.every(o => Math.hypot(o.x-pl.x, o.y-pl.y) > o.r+pl.r+70)) { S.pillars.push(pl); break; }
    }
  }
  if (boss) { spawn('boar', W-220, H/2); toast('警告：大型反応 ボルトボア', C.red); return; }
  const budget = 6 + n*3;
  let used = 0;
  while (used < budget) {
    const r = Math.random();
    const type = r < 0.5 ? 'drone' : r < 0.8 ? 'grunt' : 'turret';
    used += type==='drone' ? 1 : 2;
    let x, y, t = 0;
    do { x = W*0.45 + Math.random()*(W*0.5 - WALL - 20); y = WALL+30 + Math.random()*(H-2*WALL-60); t++; }
    while (t < 20 && S.pillars.some(o => Math.hypot(o.x-x, o.y-y) < o.r+30));
    spawn(type, x, y);
  }
  toast(`区画 ${n}／${S.rooms}  敵反応 ${S.enemies.length}`, C.cyan);
}

function spawn(type, x, y) {
  const lv = 1 + (S.room-1)*0.25;
  const T = {
    drone: { r:10, hp:28*lv, speed:120, dmg:8, xp:6, color:C.cyan },
    grunt: { r:15, hp:64*lv, speed:70, dmg:13, xp:12, color:C.mag },
    turret:{ r:13, hp:46*lv, speed:28, dmg:10, xp:10, color:C.amber, fire:1.6 },
    boar:  { r:42, hp:1100, speed:70, dmg:22, xp:120, color:'#fff36b', boss:true, weak:'cold' },
  }[type];
  S.enemies.push({ type, x, y, vx:0, vy:0, ...T, maxHp:T.hp, cd:Math.random()*1.5, hit:0, state:'chase', t:0, n:0, slow:0 });
}

/* ---------- loot ---------- */
function rollRarity() {
  let r = Math.random()*100;
  for (let i=0;i<RAR.length;i++) { if ((r -= RAR[i].w) < 0) return i; }
  return 0;
}
function makeItem(bonus) {
  const ri = Math.min(3, rollRarity() + (bonus||0));
  const slot = ['武器','防具','アクセ'][Math.random()*3|0];
  const it = { slot, ri, lines:[] };
  const pool = ['dmg','crit','spd','hp','elem'];
  const n = ri + 1;
  const used = new Set();
  const scale = 1 + ri*0.5;
  if (slot==='武器') { it.dmg = +(0.08*scale).toFixed(2); it.lines.push(`攻撃 +${Math.round(it.dmg*100)}%`); used.add('dmg'); }
  if (slot==='防具') { it.hp = Math.round(12*scale); it.lines.push(`最大HP +${it.hp}`); used.add('hp'); }
  if (slot==='アクセ') { it.crit = +(0.04*scale).toFixed(2); it.lines.push(`会心 +${Math.round(it.crit*100)}%`); used.add('crit'); }
  while (used.size < Math.min(n, pool.length)) {
    const a = pool[Math.random()*pool.length|0]; if (used.has(a)) continue; used.add(a);
    if (a==='dmg') { it.dmg = +(0.05*scale).toFixed(2); it.lines.push(`攻撃 +${Math.round(it.dmg*100)}%`); }
    if (a==='crit') { it.crit = +(0.03*scale).toFixed(2); it.lines.push(`会心 +${Math.round(it.crit*100)}%`); }
    if (a==='spd') { it.spd = +(0.05*scale).toFixed(2); it.lines.push(`移動 +${Math.round(it.spd*100)}%`); }
    if (a==='hp') { it.hp = Math.round(8*scale); it.lines.push(`最大HP +${it.hp}`); }
    if (a==='elem') { it.elem = ['shock','heat','cold'][Math.random()*3|0]; it.lines.push(`${ELEM[it.elem].name}属性`); }
  }
  const nouns = { '武器':'ブレードモッド', '防具':'装甲ジャケット', 'アクセ':'データリング' };
  it.name = `${RAR[ri].name} ${nouns[slot]}`;
  it.score = (it.dmg||0)*100 + (it.crit||0)*100 + (it.spd||0)*80 + (it.hp||0)*0.5 + (it.elem?6:0);
  return it;
}
function pickUp(l) {
  const it = l.item, cur = S.gear[it.slot];
  if (!cur || it.score > cur.score) {
    S.gear[it.slot] = it; recalc();
    toast(`装備：${it.name}　${it.lines.join(' / ')}`, RAR[it.ri].color);
  } else {
    S.p.hp = Math.min(S.st.maxHp, S.p.hp + 4);
    toast(`${it.name} は今の装備より弱い（分解して HP+4）`, C.dim);
  }
}

/* ---------- combat ---------- */
function damageMul() {
  let m = 1 + S.st.dmg;
  if (S.p.adrenT > 0) m += 0.5;
  return m;
}
function hitEnemy(e, base, dx, dy, kb) {
  const crit = Math.random() < S.st.crit;
  let d = base * damageMul() * (crit ? 2 : 1);
  const weak = S.st.elem && e.weak === S.st.elem;
  if (weak) d *= 1.5;
  if (S.st.elem === 'cold') e.slow = 1.2;
  d = Math.round(d);
  e.hp -= d; e.hit = 0.1;
  if (!e.boss) { const l = Math.hypot(dx,dy)||1; e.vx += dx/l*kb; e.vy += dy/l*kb; }
  floatText(e.x, e.y - e.r - 6, (crit?'会心 ':'') + d + (weak?' 弱点':''), crit ? C.amber : weak ? C.ice : C.ink, crit||weak ? 20 : 15);
  burst(e.x, e.y, S.st.elem ? ELEM[S.st.elem].color : e.color, crit ? 10 : 5);
  if (crit) addShake(4);
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  if (e.dead) return; e.dead = true;
  S.kills++;
  burst(e.x, e.y, e.color, e.boss ? 80 : 18, e.boss ? 380 : 220);
  addShake(e.boss ? 18 : 3);
  gainXp(e.xp);
  if (S.implants.nano) S.p.hp = Math.min(S.st.maxHp, S.p.hp + 2);
  if (e.boss) {
    for (let i=0;i<3;i++) S.loot.push({ x:e.x + (i-1)*40, y:e.y, item:makeItem(1+i%2), t:0 });
    S.mode = 'win'; S.winT = 0;
    return;
  }
  const chance = e.type==='drone' ? 0.16 : 0.32;
  if (Math.random() < chance) S.loot.push({ x:e.x, y:e.y, item:makeItem(0), t:0 });
  if (S.implants.chain) {
    const near = S.enemies.filter(o => !o.dead && o!==e && Math.hypot(o.x-e.x,o.y-e.y) < 170)
      .sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y)).slice(0,2);
    for (const o of near) { S.bolts.push({ x1:e.x, y1:e.y, x2:o.x, y2:o.y, t:0.18 }); hitEnemy(o, 18, o.x-e.x, o.y-e.y, 80); }
  }
}
function gainXp(x) {
  const p = S.p; p.xp += x;
  if (p.xp >= p.xpNext && !S.choices) {
    p.xp -= p.xpNext; p.lvl++; p.xpNext = Math.round(p.xpNext*1.35);
    const pool = IMPLANTS.filter(i => i.stack || !S.implants[i.id]);
    const ch = [];
    while (ch.length < 3 && pool.length) ch.push(pool.splice(Math.random()*pool.length|0, 1)[0]);
    S.choices = ch;
  }
}
function chooseImplant(i) {
  const c = S.choices && S.choices[i]; if (!c) return;
  S.implants[c.id] = (S.implants[c.id]||0) + 1;
  recalc();
  if (c.id === 'armor') S.p.hp = S.st.maxHp;
  toast(`インプラント導入：${c.name}`, C.mag);
  S.choices = null;
  if (S.p.xp >= S.p.xpNext) gainXp(0);
}
function hurtPlayer(d) {
  const p = S.p; if (p.inv > 0 || S.mode !== 'play') return;
  p.hp -= d; p.inv = 0.6; addShake(8);
  floatText(p.x, p.y - 22, '-' + d, C.red, 18);
  burst(p.x, p.y, C.red, 12);
  if (p.hp <= 0) { p.hp = 0; S.mode = 'dead'; addShake(14); }
}

function attack() {
  const p = S.p, w = WEAPONS[p.weapon];
  if (p.atkCd > 0) return;
  p.atkCd = w.cd;
  if (w.type === 'melee') {
    const range = w.range * (S.implants.reach ? 1.25 : 1);
    const ang = Math.atan2(p.fy, p.fx);
    p.swing = { ang, arc:w.arc, range, t:0, dur: p.weapon===0 ? 0.22 : 0.12, heavy: p.weapon===0 };
    for (const e of S.enemies) {
      if (e.dead) continue;
      const dx = e.x-p.x, dy = e.y-p.y, dist = Math.hypot(dx,dy);
      if (dist - e.r > range) continue;
      let da = Math.atan2(dy,dx) - ang; da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) <= w.arc/2 || dist < e.r + p.r + 6) hitEnemy(e, w.dmg, dx, dy, p.weapon===0 ? 420 : 160);
    }
    if (p.weapon===0) addShake(3);
  } else {
    let ax = p.fx, ay = p.fy;
    let best = null, bd = 460;
    for (const e of S.enemies) { if (e.dead) continue; const d = Math.hypot(e.x-p.x, e.y-p.y);
      const dot = ((e.x-p.x)*p.fx + (e.y-p.y)*p.fy)/(d||1); if (d < bd && dot > 0.35) { bd = d; best = e; } }
    if (best) { const d = Math.hypot(best.x-p.x, best.y-p.y)||1; ax = (best.x-p.x)/d; ay = (best.y-p.y)/d; }
    S.shots.push({ x:p.x+ax*16, y:p.y+ay*16, vx:ax*w.speed, vy:ay*w.speed, r:4, dmg:w.dmg, mine:true, pierce: S.implants.reach ? 1 : 0, hitSet:new Set(), life:1 });
  }
}

/* ---------- update ---------- */
function collideCircle(o) {
  o.x = Math.max(WALL+o.r, Math.min(W-WALL-o.r, o.x));
  o.y = Math.max(WALL+o.r, Math.min(H-WALL-o.r, o.y));
  for (const pl of S.pillars) {
    const dx = o.x-pl.x, dy = o.y-pl.y, d = Math.hypot(dx,dy), m = pl.r + o.r;
    if (d < m && d > 0) { o.x = pl.x + dx/d*m; o.y = pl.y + dy/d*m; }
  }
}

function update(dt) {
  S.time += dt;
  for (const t of S.toasts) t.t -= dt;
  S.toasts = S.toasts.filter(t => t.t > 0);
  updateFx(dt);
  if (S.mode === 'win') { S.winT += dt; }
  if (S.mode !== 'play' && S.mode !== 'win') return;
  if (S.choices) return;
  const p = S.p;

  // movement
  let mx = 0, my = 0;
  if (keys.has('a')||keys.has('arrowleft')) mx--;
  if (keys.has('d')||keys.has('arrowright')) mx++;
  if (keys.has('w')||keys.has('arrowup')) my--;
  if (keys.has('s')||keys.has('arrowdown')) my++;
  const ml = Math.hypot(mx,my);
  if (ml) { mx/=ml; my/=ml; p.fx = mx; p.fy = my; }
  p.atkCd -= dt; p.dashCd -= dt; p.inv -= dt; p.adrenT -= dt;
  if (p.dashT > 0) {
    p.dashT -= dt; p.x += p.dvx*dt; p.y += p.dvy*dt;
    if (Math.random()<0.8) S.fx.push({ x:p.x, y:p.y, vx:0, vy:0, life:0.25, max:0.25, color:C.cyan, size:9, ghost:true });
  } else {
    const sp = 210 * (1 + S.st.spd) * (p.swing && p.swing.heavy ? 0.45 : 1);
    p.x += mx*sp*dt; p.y += my*sp*dt;
  }
  collideCircle(p);
  if (keys.has('j')) attack();
  if (p.swing) { p.swing.t += dt; if (p.swing.t > p.swing.dur) p.swing = null; }

  // enemies
  for (const e of S.enemies) {
    if (e.dead) continue;
    e.hit -= dt; e.slow -= dt; e.cd -= dt;
    const sl = e.slow > 0 ? 0.6 : 1;
    const dx = p.x-e.x, dy = p.y-e.y, d = Math.hypot(dx,dy)||1;
    if (e.boss) updateBoss(e, dt, dx, dy, d, sl);
    else {
      if (e.type === 'turret') {
        const want = d < 240 ? -1 : d > 360 ? 1 : 0;
        e.x += dx/d*e.speed*want*dt*sl; e.y += dy/d*e.speed*want*dt*sl;
        if (e.cd <= 0) { e.cd = e.fire / sl;
          S.shots.push({ x:e.x, y:e.y, vx:dx/d*230, vy:dy/d*230, r:5, dmg:e.dmg, mine:false, life:3 }); }
      } else {
        const wob = e.type==='drone' ? Math.sin(S.time*5 + e.x*0.01)*0.6 : 0;
        const ax = dx/d - dy/d*wob, ay = dy/d + dx/d*wob;
        e.x += ax*e.speed*dt*sl; e.y += ay*e.speed*dt*sl;
      }
      e.x += e.vx*dt; e.y += e.vy*dt; e.vx *= 0.86; e.vy *= 0.86;
      if (d < e.r + p.r) hurtPlayer(e.dmg);
    }
    collideCircle(e);
  }
  // separation
  const live = S.enemies.filter(e => !e.dead);
  for (let i=0;i<live.length;i++) for (let j=i+1;j<live.length;j++) {
    const a = live[i], b = live[j], dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy), m = a.r+b.r;
    if (d < m && d > 0) { const push = (m-d)/2; if (!a.boss) { a.x -= dx/d*push; a.y -= dy/d*push; } if (!b.boss) { b.x += dx/d*push; b.y += dy/d*push; } }
  }
  S.enemies = S.enemies.filter(e => !e.dead);

  // shots
  for (const s of S.shots) {
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    if (s.x < WALL || s.x > W-WALL || s.y < WALL || s.y > H-WALL || S.pillars.some(o => Math.hypot(o.x-s.x,o.y-s.y) < o.r)) s.life = 0;
    if (s.life <= 0) continue;
    if (s.mine) {
      for (const e of S.enemies) {
        if (e.dead || s.hitSet.has(e) || Math.hypot(e.x-s.x, e.y-s.y) > e.r + s.r) continue;
        s.hitSet.add(e); hitEnemy(e, s.dmg, s.vx, s.vy, 120);
        if (s.pierce-- <= 0) { s.life = 0; break; }
      }
    } else if (Math.hypot(p.x-s.x, p.y-s.y) < p.r + s.r) { hurtPlayer(s.dmg); s.life = 0; }
  }
  S.shots = S.shots.filter(s => s.life > 0);

  // loot
  for (const l of S.loot) { l.t += dt; if (Math.hypot(l.x-p.x, l.y-p.y) < 26) { l.taken = true; pickUp(l); } }
  S.loot = S.loot.filter(l => !l.taken);

  // door
  if (S.mode === 'play' && !S.doorOpen && S.enemies.length === 0) { S.doorOpen = true; toast('区画制圧　右のゲートが開いた', C.green); }
  if (S.doorOpen && p.x > W - WALL - p.r - 2 && Math.abs(p.y - H/2) < 50 && S.room < S.rooms) enterRoom(S.room + 1);
}

function updateBoss(e, dt, dx, dy, d, sl) {
  const p = S.p;
  e.t -= dt;
  if (e.state === 'chase') {
    e.x += dx/d*e.speed*dt*sl; e.y += dy/d*e.speed*dt*sl;
    if (e.t <= 0) {
      e.n++;
      if (e.n % 3 === 0) { e.state = 'stompWind'; e.t = 0.8; }
      else { e.state = 'chargeWind'; e.t = 0.75; e.cx = dx/d; e.cy = dy/d; }
    }
  } else if (e.state === 'chargeWind') {
    e.cx = e.cx*0.9 + dx/d*0.1; e.cy = e.cy*0.9 + dy/d*0.1;
    const l = Math.hypot(e.cx,e.cy)||1; e.cx/=l; e.cy/=l;
    if (e.t <= 0) { e.state = 'charge'; e.t = 0.7; }
  } else if (e.state === 'charge') {
    const sp = 560*sl;
    e.x += e.cx*sp*dt; e.y += e.cy*sp*dt;
    if (Math.random()<0.6) burst(e.x - e.cx*e.r, e.y - e.cy*e.r, '#fff36b', 1, 80);
    const hitWall = e.x <= WALL+e.r+1 || e.x >= W-WALL-e.r-1 || e.y <= WALL+e.r+1 || e.y >= H-WALL-e.r-1;
    if (e.t <= 0 || hitWall) { e.state = 'recover'; e.t = hitWall ? 1.1 : 0.6; if (hitWall) { addShake(10); floatText(e.x, e.y-e.r-10, 'スタン!', C.amber, 18); } }
  } else if (e.state === 'stompWind') {
    if (e.t <= 0) { e.state = 'recover'; e.t = 0.9; e.ring = { r:e.r, done:false }; addShake(12); burst(e.x, e.y, '#fff36b', 30, 260); }
  } else if (e.state === 'recover') {
    if (e.t <= 0) { e.state = 'chase'; e.t = 1.4 + Math.random(); }
  }
  if (e.ring) {
    e.ring.r += 330*dt;
    if (!e.ring.done && Math.abs(Math.hypot(p.x-e.x, p.y-e.y) - e.ring.r) < 14) { e.ring.done = true; hurtPlayer(18); }
    if (e.ring.r > 300) e.ring = null;
  }
  if (Math.hypot(p.x-e.x, p.y-e.y) < e.r + p.r) hurtPlayer(e.state==='charge' ? e.dmg+10 : e.dmg);
}

/* ---------- fx ---------- */
function burst(x, y, color, n, sp) {
  sp = sp || 200;
  for (let i=0;i<n;i++) { const a = Math.random()*Math.PI*2, v = sp*(0.3+Math.random()*0.7);
    S.fx.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:0.35+Math.random()*0.3, max:0.65, color, size:2+Math.random()*2.5 }); }
}
function floatText(x, y, s, color, size) { S.texts.push({ x, y, s, color, size, t:0.8 }); }
function toast(s, color) { S.toasts.push({ s, color, t:3.2 }); if (S.toasts.length > 4) S.toasts.shift(); }
function addShake(v) { if (!reduceMotion) shake = Math.max(shake, v); }
function updateFx(dt) {
  for (const f of S.fx) { f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= 0.9; f.vy *= 0.9; f.life -= dt; }
  S.fx = S.fx.filter(f => f.life > 0);
  for (const t of S.texts) { t.y -= 40*dt; t.t -= dt; }
  S.texts = S.texts.filter(t => t.t > 0);
  for (const b of S.bolts) b.t -= dt;
  S.bolts = S.bolts.filter(b => b.t > 0);
  shake *= 0.85;
}

/* ---------- draw ---------- */
function glow(color, blur) { g.shadowColor = color; g.shadowBlur = blur; }
function drawFloor() {
  g.fillStyle = '#0b0914'; g.fillRect(0,0,W,H);
  g.strokeStyle = 'rgba(120,90,255,0.10)'; g.lineWidth = 1;
  for (let x=WALL; x<W; x+=40) { g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for (let y=WALL; y<H; y+=40) { g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.fillStyle = '#16122a'; g.fillRect(0,0,W,WALL); g.fillRect(0,H-WALL,W,WALL); g.fillRect(0,0,WALL,H); g.fillRect(W-WALL,0,WALL,H);
  glow(C.mag, 14); g.strokeStyle = C.mag; g.lineWidth = 2; g.strokeRect(WALL, WALL, W-2*WALL, H-2*WALL); g.shadowBlur = 0;
  // gates
  g.fillStyle = '#0b0914'; g.fillRect(0, H/2-50, WALL, 100);
  const open = S.doorOpen && S.room < S.rooms;
  glow(open ? C.green : C.red, 16); g.fillStyle = open ? C.green : C.red;
  g.fillRect(W-WALL, H/2-50, 6, 100); g.shadowBlur = 0;
  if (open) { g.fillStyle = 'rgba(93,255,160,' + (0.15+0.1*Math.sin(S.time*6)) + ')'; g.fillRect(W-WALL-40, H/2-50, 40, 100); }
  for (const pl of S.pillars) {
    g.fillStyle = '#1b1631'; g.beginPath(); g.arc(pl.x, pl.y, pl.r, 0, Math.PI*2); g.fill();
    glow(C.cyan, 10); g.strokeStyle = 'rgba(46,242,255,0.6)'; g.lineWidth = 2; g.stroke(); g.shadowBlur = 0;
  }
}
function drawEnemy(e) {
  g.save(); g.translate(e.x, e.y);
  const col = e.hit > 0 ? '#ffffff' : e.color;
  glow(col, 14); g.strokeStyle = col; g.lineWidth = 2.5; g.fillStyle = 'rgba(10,8,20,0.85)';
  if (e.type === 'drone') {
    g.rotate(S.time*4); g.beginPath();
    for (let i=0;i<3;i++) { const a = i*Math.PI*2/3; g.lineTo(Math.cos(a)*e.r*1.3, Math.sin(a)*e.r*1.3); }
    g.closePath(); g.fill(); g.stroke();
  } else if (e.type === 'grunt') {
    g.beginPath(); g.rect(-e.r, -e.r, e.r*2, e.r*2); g.fill(); g.stroke();
    g.fillStyle = col; g.fillRect(-5, -4, 10, 4);
  } else if (e.type === 'turret') {
    g.beginPath(); g.arc(0,0,e.r,0,Math.PI*2); g.fill(); g.stroke();
    const a = Math.atan2(S.p.y-e.y, S.p.x-e.x); g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*e.r*1.6, Math.sin(a)*e.r*1.6); g.stroke();
  } else if (e.type === 'boar') {
    if (e.state === 'chargeWind') { g.shadowBlur = 0; g.strokeStyle = 'rgba(255,77,94,' + (0.4+0.4*Math.sin(S.time*30)) + ')'; g.lineWidth = e.r*1.6;
      g.beginPath(); g.moveTo(0,0); g.lineTo(e.cx*560*0.7, e.cy*560*0.7); g.stroke(); g.lineWidth = 2.5; glow(col, 14); g.strokeStyle = col; }
    if (e.state === 'stompWind') { g.shadowBlur = 0; g.fillStyle = 'rgba(255,77,94,0.18)'; g.beginPath(); g.arc(0,0,e.r + (1-e.t/0.8)*60,0,Math.PI*2); g.fill(); glow(col,14); g.fillStyle = 'rgba(10,8,20,0.85)'; }
    const a = e.state==='charge'||e.state==='chargeWind' ? Math.atan2(e.cy, e.cx) : Math.atan2(S.p.y-e.y, S.p.x-e.x);
    g.rotate(a);
    g.beginPath(); g.ellipse(0,0,e.r*1.15,e.r*0.85,0,0,Math.PI*2); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(e.r*0.9, -e.r*0.4); g.lineTo(e.r*1.55, -e.r*0.7); g.moveTo(e.r*0.9, e.r*0.4); g.lineTo(e.r*1.55, e.r*0.7); g.stroke();
    g.fillStyle = C.red; g.fillRect(e.r*0.55, -e.r*0.3, 6, 6); g.fillRect(e.r*0.55, e.r*0.3-6, 6, 6);
    if (e.slow > 0) { g.strokeStyle = C.ice; g.lineWidth = 1.5; g.beginPath(); g.ellipse(0,0,e.r*1.3,e.r,0,0,Math.PI*2); g.stroke(); }
  }
  g.restore(); g.shadowBlur = 0;
  if (e.ring) { glow('#fff36b', 16); g.strokeStyle = '#fff36b'; g.lineWidth = 6; g.beginPath(); g.arc(e.x, e.y, e.ring.r, 0, Math.PI*2); g.stroke(); g.shadowBlur = 0; }
  if (!e.boss && e.hp < e.maxHp) { g.fillStyle = '#2a2546'; g.fillRect(e.x-14, e.y-e.r-9, 28, 3); g.fillStyle = e.color; g.fillRect(e.x-14, e.y-e.r-9, 28*e.hp/e.maxHp, 3); }
}
function drawPlayer() {
  const p = S.p;
  if (p.inv > 0 && Math.floor(S.time*20)%2 === 0 && p.dashT <= 0) return;
  if (p.swing) {
    const s = p.swing, k = s.t/s.dur;
    const col = S.st.elem ? ELEM[S.st.elem].color : C.cyan;
    glow(col, 18); g.strokeStyle = col; g.globalAlpha = 1-k;
    g.lineWidth = s.heavy ? 14 : 7;
    g.beginPath(); g.arc(p.x, p.y, s.range*0.8, s.ang - s.arc/2, s.ang - s.arc/2 + s.arc*Math.min(1,k*1.6)); g.stroke();
    g.globalAlpha = 1; g.shadowBlur = 0;
  }
  g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.fy, p.fx));
  glow(C.cyan, 16); g.fillStyle = '#0b0914'; g.strokeStyle = p.adrenT > 0 ? C.mag : C.cyan; g.lineWidth = 2.5;
  g.beginPath(); g.arc(0,0,p.r,0,Math.PI*2); g.fill(); g.stroke();
  g.fillStyle = g.strokeStyle; g.beginPath(); g.moveTo(p.r+8,0); g.lineTo(p.r-1,-5); g.lineTo(p.r-1,5); g.closePath(); g.fill();
  g.restore(); g.shadowBlur = 0;
}
function drawShots() {
  for (const s of S.shots) {
    const col = s.mine ? (S.st.elem ? ELEM[S.st.elem].color : C.cyan) : C.amber;
    glow(col, 12); g.strokeStyle = col; g.lineWidth = s.mine ? 3 : 4;
    const l = Math.hypot(s.vx,s.vy)||1;
    g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x - s.vx/l*(s.mine?16:6), s.y - s.vy/l*(s.mine?16:6)); g.stroke();
  }
  g.shadowBlur = 0;
}
function drawLoot() {
  for (const l of S.loot) {
    const col = RAR[l.item.ri].color, bob = Math.sin(S.time*4 + l.x)*3;
    glow(col, 18); g.strokeStyle = col; g.lineWidth = 2;
    g.save(); g.translate(l.x, l.y + bob); g.rotate(Math.PI/4); g.strokeRect(-7,-7,14,14); g.restore();
    if (l.item.ri >= 2) { g.globalAlpha = 0.25; g.fillStyle = col; g.fillRect(l.x-2, l.y-60, 4, 60); g.globalAlpha = 1; }
  }
  g.shadowBlur = 0;
}
function drawFx() {
  for (const f of S.fx) { g.globalAlpha = Math.max(0, f.life/f.max) * (f.ghost ? 0.35 : 1); g.fillStyle = f.color;
    if (f.ghost) { g.beginPath(); g.arc(f.x, f.y, f.size+3, 0, Math.PI*2); g.fill(); } else g.fillRect(f.x, f.y, f.size, f.size); }
  g.globalAlpha = 1;
  for (const b of S.bolts) { glow('#fff36b', 14); g.strokeStyle = '#fff36b'; g.lineWidth = 2; g.beginPath(); g.moveTo(b.x1,b.y1);
    for (let i=1;i<5;i++) { const k=i/5; g.lineTo(b.x1+(b.x2-b.x1)*k+(Math.random()-0.5)*18, b.y1+(b.y2-b.y1)*k+(Math.random()-0.5)*18); }
    g.lineTo(b.x2,b.y2); g.stroke(); }
  g.shadowBlur = 0;
  g.textAlign = 'center';
  for (const t of S.texts) { g.globalAlpha = Math.min(1, t.t*2); g.font = `700 ${t.size}px ${FONT}`; g.fillStyle = t.color; g.fillText(t.s, t.x, t.y); }
  g.globalAlpha = 1;
}
function bar(x, y, w, h, k, col, label) {
  g.fillStyle = '#1b1631'; g.fillRect(x, y, w, h);
  glow(col, 8); g.fillStyle = col; g.fillRect(x, y, w*Math.max(0,k), h); g.shadowBlur = 0;
  if (label) { g.font = `500 11px ${FONT}`; g.fillStyle = C.ink; g.textAlign = 'left'; g.fillText(label, x+4, y+h-3); }
}
function drawHud() {
  const p = S.p;
  bar(40, 40, 220, 14, p.hp/S.st.maxHp, C.green, `HP ${Math.ceil(p.hp)} / ${S.st.maxHp}`);
  bar(40, 58, 220, 5, p.xp/p.xpNext, C.mag);
  g.font = `700 13px ${FONT}`; g.fillStyle = C.ink; g.textAlign = 'left';
  g.fillText(`Lv ${p.lvl}`, 268, 52);
  // weapons
  for (let i=0;i<3;i++) {
    const x = 40 + i*74, y = 72, on = i === p.weapon;
    g.strokeStyle = on ? C.cyan : '#2a2546'; g.lineWidth = on ? 2 : 1; g.strokeRect(x, y, 68, 22);
    g.fillStyle = on ? C.cyan : C.dim; g.font = `500 12px ${FONT}`; g.fillText(`${i+1} ${WEAPONS[i].name}`, x+7, y+15);
  }
  // dash
  const dk = Math.max(0, p.dashCd)/0.9;
  bar(40, 98, 68, 4, 1-dk, C.cyan);
  // room map
  g.textAlign = 'right'; g.font = `700 12px ${FONT}`;
  for (let i=1;i<=S.rooms;i++) {
    const x = W - 40 - (S.rooms - i)*30, boss = i === S.rooms;
    g.strokeStyle = i === S.room ? C.cyan : i < S.room ? C.green : '#3a3360'; g.lineWidth = 2;
    g.strokeRect(x-22, 38, 22, 16);
    g.fillStyle = boss ? C.red : C.dim; g.textAlign = 'center'; g.fillText(boss ? 'B' : String(i), x-11, 51);
  }
  // gear & implants
  g.textAlign = 'right'; g.font = `500 11px ${FONT}`;
  let y = 74;
  for (const k of ['武器','防具','アクセ']) { const it = S.gear[k];
    g.fillStyle = it ? RAR[it.ri].color : '#4a4470'; g.fillText(it ? `${k}：${it.name}` : `${k}：なし`, W-40, y); y += 15; }
  const ims = Object.keys(S.implants).map(id => { const d = IMPLANTS.find(i=>i.id===id); return S.implants[id] > 1 ? `${d.name}×${S.implants[id]}` : d.name; });
  if (ims.length) { g.fillStyle = C.mag; g.fillText('インプラント：' + ims.join('・'), W-40, y); y += 15; }
  if (S.st.elem) { g.fillStyle = ELEM[S.st.elem].color; g.fillText(`攻撃属性：${ELEM[S.st.elem].name}`, W-40, y); }
  // boss bar
  const boss = S.enemies.find(e => e.boss);
  if (boss) {
    g.textAlign = 'center'; g.font = `700 14px ${FONT}`; g.fillStyle = '#fff36b';
    g.fillText('ボルトボア　弱点：冷却', W/2, H-58);
    bar(W/2-240, H-50, 480, 10, boss.hp/boss.maxHp, C.red);
  }
  // toasts
  g.textAlign = 'center'; g.font = `500 13px ${FONT}`;
  S.toasts.forEach((t, i) => { g.globalAlpha = Math.min(1, t.t); g.fillStyle = t.color; g.fillText(t.s, W/2, 132 + i*19); });
  g.globalAlpha = 1;
}
function panel(lines, sub) {
  g.fillStyle = 'rgba(7,6,13,0.82)'; g.fillRect(0,0,W,H);
  g.textAlign = 'center';
  lines.forEach(([s, size, col], i) => { g.font = `700 ${size}px ${FONT}`; glow(col, 18); g.fillStyle = col; g.fillText(s, W/2, H/2 - 40 + i*(size+14)); });
  g.shadowBlur = 0;
  if (sub) { g.font = `500 14px ${FONT}`; g.fillStyle = C.dim; g.fillText(sub, W/2, H/2 + 90); }
}
function drawChoices() {
  g.fillStyle = 'rgba(7,6,13,0.8)'; g.fillRect(0,0,W,H);
  g.textAlign = 'center'; g.font = `700 26px ${FONT}`; glow(C.mag, 16); g.fillStyle = C.mag;
  g.fillText(`LEVEL UP  Lv ${S.p.lvl}`, W/2, 140); g.shadowBlur = 0;
  g.font = `500 14px ${FONT}`; g.fillStyle = C.dim; g.fillText('インプラントを1つ選ぶ（1・2・3キー）', W/2, 170);
  const cw = 240, gap = 24, x0 = W/2 - (cw*3 + gap*2)/2;
  S.choices.forEach((c, i) => {
    const x = x0 + i*(cw+gap), y = 200;
    g.fillStyle = '#110f1d'; g.fillRect(x, y, cw, 150);
    glow(C.cyan, 10); g.strokeStyle = C.cyan; g.lineWidth = 1.5; g.strokeRect(x, y, cw, 150); g.shadowBlur = 0;
    g.fillStyle = C.amber; g.font = `700 13px ${FONT}`; g.fillText(`[ ${i+1} ]`, x+cw/2, y+30);
    g.fillStyle = C.ink; g.font = `700 18px ${FONT}`; g.fillText(c.name, x+cw/2, y+66);
    g.fillStyle = C.dim; g.font = `500 13px ${FONT}`; g.fillText(c.desc, x+cw/2, y+100);
    if (S.implants[c.id]) { g.fillStyle = C.mag; g.font = `500 11px ${FONT}`; g.fillText(`所持 ×${S.implants[c.id]}`, x+cw/2, y+128); }
  });
}
function draw() {
  g.save();
  if (shake > 0.5) g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawFloor();
  if (S.mode !== 'title') {
    drawLoot();
    for (const e of S.enemies) drawEnemy(e);
    drawShots();
    drawPlayer();
    drawFx();
  }
  g.restore();
  if (S.mode === 'title') {
    panel([['LEGEND OF MONSTER', 48, C.cyan], ['地下廃区画 ― 狩猟依頼：ボルトボア', 18, C.mag]], 'Enter キーまたはクリックで出撃');
    return;
  }
  drawHud();
  if (S.choices) drawChoices();
  if (S.mode === 'dead') panel([['SIGNAL LOST', 46, C.red], [`区画 ${S.room} で倒れた　撃破 ${S.kills}　Lv ${S.p.lvl}`, 16, C.ink]], 'ラン中の装備はすべて失われた　Enter で再出撃');
  if (S.mode === 'win' && S.winT > 1.2) panel([['HUNT COMPLETE', 46, C.amber], [`ボルトボア討伐　撃破 ${S.kills}　Lv ${S.p.lvl}`, 16, C.ink]], '試作版はここまで　Enter でもう一度');
}

/* ---------- input & loop ---------- */
function start() { newRun(); S.mode = 'play'; enterRoom(1); }
addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  const gameKey = [' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k);
  if (gameKey && document.activeElement === cv) ev.preventDefault();
  if (k === 'enter' && (S.mode === 'title' || S.mode === 'dead' || (S.mode === 'win' && S.winT > 1.2))) { start(); cv.focus(); return; }
  if (S.choices && ['1','2','3'].includes(k)) { chooseImplant(+k-1); return; }
  if (S.mode !== 'play') return;
  keys.add(k);
  if (['1','2','3'].includes(k)) { S.p.weapon = +k-1; S.p.atkCd = Math.min(S.p.atkCd, 0.15); }
  if (k === ' ' && S.p.dashCd <= 0 && !S.choices) {
    const p = S.p; p.dashT = 0.16; p.dashCd = 0.9; p.inv = Math.max(p.inv, 0.25);
    p.dvx = p.fx*720; p.dvy = p.fy*720;
    if (S.implants.adren) p.adrenT = 2;
  }
});
addEventListener('keyup', ev => keys.delete(ev.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
cv.addEventListener('click', ev => {
  cv.focus();
  if (S.mode === 'title' || S.mode === 'dead' || (S.mode === 'win' && S.winT > 1.2)) { start(); return; }
  if (S.choices) {
    const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * H / r.height;
    const cw = 240, gap = 24, x0 = W/2 - (cw*3 + gap*2)/2;
    for (let i=0;i<3;i++) if (x > x0 + i*(cw+gap) && x < x0 + i*(cw+gap) + cw && y > 200 && y < 350) chooseImplant(i);
  }
});

newRun();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
